name: Release Formats

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-formats.yml"
      - "release/**"
      - "scripts/build_book.py"
      - "scripts/validate_book.py"
      - "scripts/prepare_release.py"
      - "scripts/validate_release.py"
      - "scripts/sanitize_epub_nav.py"
      - "cn/BOOK_MANIFEST.txt"
      - "en/BOOK_MANIFEST.txt"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-formats-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: "3.11"
  PANDOC_SHA256: "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6"
  MERMAID_CLI_VERSION: "11.17.0"
  WEASYPRINT_VERSION: "70.0"
  EPUBCHECK_VERSION: "5.4.0"

jobs:
  render:
    name: Render bilingual HTML, EPUB, and PDF
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate canonical manuscript sources
        run: |
          python scripts/validate_book.py --edition cn
          python scripts/validate_book.py --edition en

      - name: Build canonical manuscripts
        run: |
          python scripts/build_book.py --edition cn
          python scripts/build_book.py --edition en

      - name: Record deterministic source epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install CJK fonts and renderer system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk fonts-dejavu-core \
            libpango-1.0-0 libpangoft2-1.0-0 \
            default-jre-headless unzip
          fc-match 'Noto Sans CJK SC'

      - name: Install pinned Pandoc
        run: |
          curl -fsSL -o /tmp/pandoc.tar.gz \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  /tmp/pandoc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          sudo cp "/tmp/pandoc-${PANDOC_VERSION}/bin/pandoc" /usr/local/bin/pandoc
          pandoc --version | head -n 1

      - name: Install pinned Mermaid and PDF renderers
        run: |
          npm install --global "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}"
          python -m pip install --disable-pip-version-check "weasyprint==${WEASYPRINT_VERSION}"
          mmdc --version
          weasyprint --version

      - name: Install pinned EPUBCheck
        run: |
          curl -fsSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q /tmp/epubcheck.zip -d /tmp
          java -jar "/tmp/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" --version

      - name: Prepare bilingual release manuscripts and diagrams
        run: |
          python scripts/prepare_release.py --edition cn
          python scripts/prepare_release.py --edition en

      - name: Render Mermaid diagrams
        shell: bash
        run: |
          shopt -s nullglob
          for edition in cn en; do
            diagrams=(dist/release/"$edition"/diagrams/*.mmd)
            if [ "${#diagrams[@]}" -eq 0 ]; then
              echo "$edition: no Mermaid diagrams; skipping render"
              continue
            fi
            for source in "${diagrams[@]}"; do
              svg="${source%.mmd}.svg"
              png="${source%.mmd}.png"
              mmdc --input "$source" --output "$svg" \
                --configFile release/mermaid-config.json \
                --puppeteerConfigFile release/puppeteer-config.json \
                --backgroundColor transparent
              mmdc --input "$source" --output "$png" \
                --configFile release/mermaid-config.json \
                --puppeteerConfigFile release/puppeteer-config.json \
                --backgroundColor white \
                --scale 2
            done
          done

      - name: Render standalone HTML
        run: |
          for edition in cn en; do
            pandoc "dist/release/$edition/Advanced-C11-Programming.release.md" \
              --from markdown-raw_html \
              --to html5 \
              --standalone \
              --toc --toc-depth=3 \
              --section-divs \
              --embed-resources \
              --resource-path="dist/release/$edition:release" \
              --css release/book.css \
              --output "dist/release/$edition/Advanced-C11-Programming.html"
          done

      - name: Render EPUB3
        run: |
          for edition in cn en; do
            pandoc "dist/release/$edition/Advanced-C11-Programming.epub.md" \
              --from markdown-raw_html \
              --to epub3 \
              --toc --toc-depth=3 \
              --split-level=1 \
              --resource-path="dist/release/$edition:release" \
              --css release/book.css \
              --output "dist/release/$edition/Advanced-C11-Programming.epub"
          done

      - name: Normalize EPUB navigation
        run: |
          python scripts/sanitize_epub_nav.py --edition cn
          python scripts/sanitize_epub_nav.py --edition en

      - name: Validate EPUB conformance
        run: |
          for edition in cn en; do
            java -jar "/tmp/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" \
              "dist/release/$edition/Advanced-C11-Programming.epub"
          done

      - name: Render PDF from canonical HTML
        run: |
          for edition in cn en; do
            weasyprint \
              "dist/release/$edition/Advanced-C11-Programming.html" \
              "dist/release/$edition/Advanced-C11-Programming.pdf"
          done

      - name: Record bilingual release provenance
        run: |
          cp dist/cn/Advanced-C11-Programming.md dist/release/cn/Advanced-C11-Programming.md
          cp dist/en/Advanced-C11-Programming.md dist/release/en/Advanced-C11-Programming.md
          cp SOURCE_SNAPSHOTS.md dist/release/SOURCE_SNAPSHOTS.md
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "editions=cn,en"
            echo "pandoc=${PANDOC_VERSION}"
            echo "mermaid_cli=${MERMAID_CLI_VERSION}"
            echo "weasyprint=${WEASYPRINT_VERSION}"
            echo "epubcheck=${EPUBCHECK_VERSION}"
            echo "python=$(python --version 2>&1)"
            echo "node=$(node --version)"
          } > dist/release/RENDERER_VERSIONS.txt

      - name: Validate release artifacts
        run: |
          python scripts/validate_release.py --edition cn
          python scripts/validate_release.py --edition en

      - name: Prepare uniquely named GitHub Release assets
        run: |
          for edition in cn en; do
            for ext in md html epub pdf; do
              cp \
                "dist/release/$edition/Advanced-C11-Programming.$ext" \
                "dist/release/Advanced-C11-Programming-$edition.$ext"
            done
          done

      - name: Write checksums
        working-directory: dist/release
        run: |
          sha256sum \
            Advanced-C11-Programming-cn.md \
            Advanced-C11-Programming-cn.html \
            Advanced-C11-Programming-cn.epub \
            Advanced-C11-Programming-cn.pdf \
            Advanced-C11-Programming-en.md \
            Advanced-C11-Programming-en.html \
            Advanced-C11-Programming-en.epub \
            Advanced-C11-Programming-en.pdf \
            SOURCE_SNAPSHOTS.md \
            RENDERER_VERSIONS.txt \
            > SHA256SUMS.txt

      - name: Upload bilingual release-format artifact
        uses: actions/upload-artifact@v4
        with:
          name: advanced-c11-programming-bilingual-release-formats
          path: |
            dist/release/cn/Advanced-C11-Programming.md
            dist/release/cn/Advanced-C11-Programming.html
            dist/release/cn/Advanced-C11-Programming.epub
            dist/release/cn/Advanced-C11-Programming.pdf
            dist/release/en/Advanced-C11-Programming.md
            dist/release/en/Advanced-C11-Programming.html
            dist/release/en/Advanced-C11-Programming.epub
            dist/release/en/Advanced-C11-Programming.pdf
            dist/release/Advanced-C11-Programming-cn.md
            dist/release/Advanced-C11-Programming-cn.html
            dist/release/Advanced-C11-Programming-cn.epub
            dist/release/Advanced-C11-Programming-cn.pdf
            dist/release/Advanced-C11-Programming-en.md
            dist/release/Advanced-C11-Programming-en.html
            dist/release/Advanced-C11-Programming-en.epub
            dist/release/Advanced-C11-Programming-en.pdf
            dist/release/SOURCE_SNAPSHOTS.md
            dist/release/RENDERER_VERSIONS.txt
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            dist/release/Advanced-C11-Programming-cn.md
            dist/release/Advanced-C11-Programming-cn.html
            dist/release/Advanced-C11-Programming-cn.epub
            dist/release/Advanced-C11-Programming-cn.pdf
            dist/release/Advanced-C11-Programming-en.md
            dist/release/Advanced-C11-Programming-en.html
            dist/release/Advanced-C11-Programming-en.epub
            dist/release/Advanced-C11-Programming-en.pdf
            dist/release/SOURCE_SNAPSHOTS.md
            dist/release/RENDERER_VERSIONS.txt
            dist/release/SHA256SUMS.txt
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Advanced C11 Programming ${GITHUB_REF_NAME}" \
              --generate-notes \
              --notes "Chinese and English Markdown/HTML/EPUB/PDF formats were rendered from the same validated source commit. Implementation provenance is attached in SOURCE_SNAPSHOTS.md; renderer versions and SHA-256 checksums are attached alongside it."
          fi
