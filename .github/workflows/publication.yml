name: Publication

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manuscript:
    name: Validate and build manuscript (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        edition:
          - cn
          - en

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate book
        run: python scripts/validate_book.py --edition "${{ matrix.edition }}"

      - name: Audit explanatory text fences
        run: python scripts/audit_text_fences.py --edition "${{ matrix.edition }}"

      - name: Build canonical manuscript
        run: python scripts/build_book.py --edition "${{ matrix.edition }}"

      - name: Upload manuscript
        uses: actions/upload-artifact@v4
        with:
          name: advanced-c11-programming-manuscript-${{ matrix.edition }}
          path: dist/${{ matrix.edition }}/Advanced-C11-Programming.md
          if-no-files-found: error
          retention-days: 14

  qualification:
    name: Compile executable book gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download latest installed SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "advanced-c11-book-qualification",
          }
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def restore(repo, asset_prefix, package_name, root_name, cmake_config):
              api = f"https://api.github.com/repos/{repo}/releases/latest"
              request = urllib.request.Request(api, headers=headers)
              with urllib.request.urlopen(request) as response:
                  release = json.load(response)

              assets = [
                  asset for asset in release.get("assets", [])
                  if asset.get("name", "").startswith(asset_prefix)
                  and asset.get("name", "").endswith(".nupkg")
              ]
              if len(assets) != 1:
                  raise SystemExit(
                      f"expected exactly one {asset_prefix}*.nupkg in latest "
                      f"{repo} release; got {len(assets)}"
                  )

              package = Path("/tmp") / package_name
              asset_headers = {
                  "Accept": "application/octet-stream",
                  "User-Agent": "advanced-c11-book-qualification",
              }
              if token:
                  asset_headers["Authorization"] = f"Bearer {token}"
              asset_request = urllib.request.Request(
                  assets[0]["browser_download_url"],
                  headers=asset_headers,
              )
              with urllib.request.urlopen(asset_request) as source, package.open("wb") as output:
                  shutil.copyfileobj(source, output)

              root = Path("/tmp") / root_name
              if root.exists():
                  shutil.rmtree(root)
              with zipfile.ZipFile(package) as archive:
                  archive.extractall(root)

              prefix = root / "sdk" / "linux-x64"
              config = prefix / cmake_config
              if not config.is_file():
                  raise SystemExit(f"missing installed CMake package: {config}")

              print(
                  f"Using latest {repo} release {release.get('tag_name')}: "
                  f"{assets[0]['name']}"
              )
              return prefix

          salts = restore(
              "qigao/salts",
              "Salts.Native.",
              "Salts.Native.nupkg",
              "salts-native",
              Path("lib/cmake/Salts/SaltsConfig.cmake"),
          )
          salts_utils = restore(
              "qigao/salts-utils",
              "SaltsUtils.Native.",
              "SaltsUtils.Native.nupkg",
              "salts-utils-native",
              Path("lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"),
          )

          # Python zip extraction does not restore the executable permission
          # carried by the NuGet archive. The release contract requires the
          # matching host compiler in the linux-x64 SDK; restore only its mode,
          # never substitute another compiler.
          idlc = salts_utils / "bin" / "salts-idlc"
          if not idlc.is_file():
              raise SystemExit(f"latest SaltsUtils SDK is missing host salts-idlc: {idlc}")
          idlc.chmod(idlc.stat().st_mode | 0o111)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SALTS_SDK_PREFIX={salts}\n")
              env.write(f"SALTS_UTILS_SDK_PREFIX={salts_utils}\n")
          PY

      - name: Configure qualification gates
        env:
          SALTS_ROOT: ${{ env.SALTS_SDK_PREFIX }}
          SALTS_UTILS_ROOT: ${{ env.SALTS_UTILS_SDK_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S qualification \
            -B build/qualification \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SALTS_SDK_PREFIX;$SALTS_UTILS_SDK_PREFIX"

      - name: Build qualification gates
        env:
          SALTS_ROOT: ${{ env.SALTS_SDK_PREFIX }}
          SALTS_UTILS_ROOT: ${{ env.SALTS_UTILS_SDK_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.SALTS_UTILS_SDK_PREFIX }}/lib:${{ env.SALTS_SDK_PREFIX }}/lib
        run: cmake --build build/qualification --parallel

      - name: Run qualification gates
        env:
          SALTS_ROOT: ${{ env.SALTS_SDK_PREFIX }}
          SALTS_UTILS_ROOT: ${{ env.SALTS_UTILS_SDK_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.SALTS_UTILS_SDK_PREFIX }}/lib:${{ env.SALTS_SDK_PREFIX }}/lib
        run: ctest --test-dir build/qualification --output-on-failure
