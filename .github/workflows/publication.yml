name: Publication

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manuscript:
    name: Validate and build manuscript (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        edition:
          - cn
          - en

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate book
        run: python scripts/validate_book.py --edition "${{ matrix.edition }}"

      - name: Audit explanatory text fences
        run: python scripts/audit_text_fences.py --edition "${{ matrix.edition }}"

      - name: Build canonical manuscript
        run: python scripts/build_book.py --edition "${{ matrix.edition }}"

      - name: Upload manuscript
        uses: actions/upload-artifact@v4
        with:
          name: advanced-c11-programming-manuscript-${{ matrix.edition }}
          path: dist/${{ matrix.edition }}/Advanced-C11-Programming.md
          if-no-files-found: error
          retention-days: 14

  qualification:
    name: Compile executable book gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download latest Salts.Native SDK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          api = "https://api.github.com/repos/qigao/salts/releases/latest"
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "advanced-c11-book-qualification",
          }
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          assets = [
              asset for asset in release.get("assets", [])
              if asset.get("name", "").startswith("Salts.Native.")
              and asset.get("name", "").endswith(".nupkg")
          ]
          if len(assets) != 1:
              raise SystemExit(
                  f"expected exactly one Salts.Native nupkg in latest release; got {len(assets)}"
              )

          package = Path("/tmp/Salts.Native.nupkg")
          asset_request = urllib.request.Request(
              assets[0]["browser_download_url"],
              headers={"User-Agent": "advanced-c11-book-qualification"},
          )
          with urllib.request.urlopen(asset_request) as source, package.open("wb") as output:
              shutil.copyfileobj(source, output)

          root = Path("/tmp/salts-native")
          with zipfile.ZipFile(package) as archive:
              archive.extractall(root)

          prefix = root / "sdk" / "linux-x64"
          config = prefix / "lib" / "cmake" / "Salts" / "SaltsConfig.cmake"
          if not config.is_file():
              raise SystemExit(f"missing installed Salts CMake package: {config}")

          print(f"Using latest Salts release {release.get('tag_name')}: {assets[0]['name']}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SALTS_SDK_PREFIX={prefix}\n")
          PY

      - name: Download latest SaltsUtils.Native SDK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import urllib.request
          from pathlib import Path

          api = "https://api.github.com/repos/qigao/salts-utils/releases/latest"
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "advanced-c11-book-qualification",
          }
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          assets = [
              asset for asset in release.get("assets", [])
              if asset.get("name", "").startswith("SaltsUtils.Native.")
              and asset.get("name", "").endswith(".nupkg")
          ]
          if len(assets) != 1:
              raise SystemExit(
                  f"expected exactly one SaltsUtils.Native nupkg in latest release; got {len(assets)}"
              )

          package = Path("/tmp/SaltsUtils.Native.nupkg")
          asset_request = urllib.request.Request(
              assets[0]["browser_download_url"],
              headers={"User-Agent": "advanced-c11-book-qualification"},
          )
          with urllib.request.urlopen(asset_request) as source, package.open("wb") as output:
              shutil.copyfileobj(source, output)

          root = Path("/tmp/saltsutils-native")
          if root.exists():
              shutil.rmtree(root)
          root.mkdir(parents=True)
          subprocess.run(
              ["unzip", "-q", "-o", str(package), "-d", str(root)],
              check=True,
          )

          prefix = root / "sdk" / "linux-x64"
          config = prefix / "lib" / "cmake" / "SaltsUtils" / "SaltsUtilsConfig.cmake"
          if not config.is_file():
              raise SystemExit(f"missing installed SaltsUtils CMake package: {config}")
          idlc = prefix / "bin" / "salts-idlc"
          if not idlc.is_file() or not os.access(idlc, os.X_OK):
              raise SystemExit(
                  f"installed SaltsUtils host compiler is not executable: {idlc}"
              )

          print(f"Using latest SaltsUtils release {release.get('tag_name')}: {assets[0]['name']}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SALTS_UTILS_SDK_PREFIX={prefix}\n")
          PY

      - name: Configure qualification gates
        env:
          SALTS_ROOT: ${{ env.SALTS_SDK_PREFIX }}
          SALTS_UTILS_ROOT: ${{ env.SALTS_UTILS_SDK_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail
          cmake             -S qualification             -B build/qualification             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH="$SALTS_SDK_PREFIX;$SALTS_UTILS_SDK_PREFIX"             -DSalts_DIR="$SALTS_SDK_PREFIX/lib/cmake/Salts"             -DSaltsUtils_DIR="$SALTS_UTILS_SDK_PREFIX/lib/cmake/SaltsUtils"             -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE             -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE

      - name: Build qualification gates
        run: cmake --build build/qualification --parallel

      - name: Run qualification gates
        env:
          LD_LIBRARY_PATH: ${{ env.SALTS_UTILS_SDK_PREFIX }}/lib:${{ env.SALTS_SDK_PREFIX }}/lib
        run: ctest --test-dir build/qualification --output-on-failure
